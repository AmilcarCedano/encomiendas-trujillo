services:
  db:
    image: mysql:8.0
    container_name: encomiendas-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    container_name: encomiendas-api
    env_file: .env
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    container_name: encomiendas-web
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db_data:
